services:
  caddy:
    profiles: [ "disabled" ] # services are exposed directly without HTTPS

  forgejo:
    ports:
      - "3000:3000"
    environment:
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__ROOT_URL: http://localhost:3000

  authentik-server:
    ports:
      - "9000:9000"
    environment:
      AUTHENTIK_HOST: http://localhost:9000

  authentik-worker:
    environment:
      AUTHENTIK_HOST: http://localhost:9000

  grafana:
    ports:
      - "3001:3000"
    environment:
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost:3001

  prometheus:
    ports:
      - "9090:9090"

  portal-backend:
    ports:
      - "8080:8080"
    environment:
      WEBPORTALFRONT_URL: http://localhost:8081

  portal-frontend:
    profiles: ["disabled"]