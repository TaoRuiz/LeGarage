services:

  # ---------------------------------------------------------------------------
  # Caddy
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: garage-caddy
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      FORGEJO_HOST: ${FORGEJO_HOST:-localhost}
      AUTHENTIK_HOST_DOMAIN: ${AUTHENTIK_HOST_DOMAIN:-localhost}
      GRAFANA_HOST: ${GRAFANA_HOST:-localhost}
      PORTAL_HOST: ${PORTAL_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - garage

  # ---------------------------------------------------------------------------
  # Forgejo
  # ---------------------------------------------------------------------------
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: garage-forgejo
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: ${FORGEJO_DB_NAME}
      FORGEJO__database__USER: ${FORGEJO_DB_USER}
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__DOMAIN: ${FORGEJO_HOST:-localhost}
      FORGEJO__server__ROOT_URL: https://${FORGEJO_HOST:-localhost}
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
    depends_on:
      forgejo-db:
        condition: service_healthy
    volumes:
      - forgejo_data:/data
    networks:
      - garage

  forgejo-db:
    image: postgres:16-alpine
    container_name: garage-forgejo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FORGEJO_DB_NAME}
      POSTGRES_USER: ${FORGEJO_DB_USER}
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
    volumes:
      - forgejo_db:/var/lib/postgresql/data
    networks:
      - garage
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${FORGEJO_DB_USER} -d ${FORGEJO_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Authentik
  # ---------------------------------------------------------------------------
  authentik-db:
    image: postgres:16-alpine
    container_name: garage-authentik-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTIK_DB_NAME}
      POSTGRES_USER: ${AUTHENTIK_DB_USER}
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - authentik_db:/var/lib/postgresql/data
    networks:
      - garage
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTHENTIK_DB_USER} -d ${AUTHENTIK_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-redis:
    image: redis:7-alpine
    container_name: garage-authentik-redis
    restart: unless-stopped
    networks:
      - garage
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.12
    container_name: garage-authentik-server
    restart: unless-stopped
    command: server
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_HOST: https://${AUTHENTIK_HOST_DOMAIN:-localhost}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    networks:
      - garage

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12
    container_name: garage-authentik-worker
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_HOST: https://${AUTHENTIK_HOST_DOMAIN:-localhost}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - garage

  # ---------------------------------------------------------------------------
  # Prometheus + Grafana
  # ---------------------------------------------------------------------------
  prometheus:
    build:
      context: ./config/prometheus
      dockerfile: Dockerfile
    container_name: garage-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    networks:
      - garage

  grafana:
    image: grafana/grafana:11.1.0
    container_name: garage-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: ${GRAFANA_HOST:-localhost}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:-localhost}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - garage

volumes:
  caddy_data:
  caddy_config:
  forgejo_data:
  forgejo_db:
  authentik_db:
  authentik_media:
  authentik_templates:
  prometheus_data:
  grafana_data:

networks:
  garage:
    name: garage